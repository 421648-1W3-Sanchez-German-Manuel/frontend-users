<div class="max-w-lg mx-auto">
  <a routerLink="/admin/usuarios" class="text-sm font-medium hover:underline" style="color: var(--color-cyan)">&larr; Volver a usuarios</a>

  <generic-card tone="magenta" padding="md" class="mt-4">
    <h1 class="text-lg mb-2" style="color: var(--color-text)">Cambiar rol</h1>
    <p class="text-sm mb-6" style="color: var(--color-text-muted)">Elegí el nuevo conjunto de roles para este usuario.</p>

    <div class="flex gap-2 flex-wrap mb-6">
      @for (role of allRoles(); track role) {
        <button
          type="button"
          class="fu-badge"
          [class.fu-badge--primary]="selectedRoles().includes(role)"
          (click)="toggleRole(role)"
        >
          {{ role }}
        </button>
      }
    </div>

    @if (errorMessage()) {
      <div class="fu-alert fu-alert--danger mb-4">
        {{ errorMessage() }}
      </div>
    }

    <generic-button variant="magenta" size="lg" [disabled]="selectedRoles().length === 0 || loading()" class="w-full" (click)="submit()">
      {{ loading() ? 'Guardando…' : 'Guardar roles' }}
    </generic-button>
  </generic-card>
</div>
