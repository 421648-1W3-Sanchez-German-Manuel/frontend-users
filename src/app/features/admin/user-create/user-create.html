<div class="max-w-lg mx-auto">
  <a routerLink="/admin/usuarios" class="text-sm font-medium hover:underline" style="color: var(--color-cyan)">&larr; Volver a usuarios</a>

  <div class="fu-card !p-8 mt-4">
    <h1 class="text-lg mb-1" style="color: var(--color-text)">Nuevo administrador</h1>
    <p class="text-sm mb-6" style="color: var(--color-text-muted)">
      Este alta es solo para cuentas ADMIN. Profesores y alumnos se dan de alta solos: al
      profesor agregalo a la <a routerLink="/admin/whitelist" class="hover:underline" style="color: var(--color-cyan)">whitelist</a>
      y el resto lo completa él mismo en su primer inicio de sesión.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4" novalidate>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="fu-label" for="firstNames">Nombres</label>
          <input id="firstNames" class="fu-input" formControlName="firstNames" />
        </div>
        <div>
          <label class="fu-label" for="lastNames">Apellidos</label>
          <input id="lastNames" class="fu-input" formControlName="lastNames" />
        </div>
      </div>
      <div>
        <label class="fu-label" for="email">Email</label>
        <input id="email" type="email" class="fu-input" formControlName="email" />
      </div>
      <div>
        <label class="fu-label" for="password">Contraseña inicial</label>
        <input id="password" type="password" class="fu-input" formControlName="password" />
      </div>

      @if (errorMessage()) {
        <div class="fu-alert fu-alert--danger">
          {{ errorMessage() }}
        </div>
      }

      <button fuButton variant="primary" size="lg" type="submit" [loading]="loading()" class="w-full mt-2">
        Crear administrador
      </button>
    </form>
  </div>
</div>
