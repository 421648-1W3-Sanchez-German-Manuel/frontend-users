<div class="max-w-lg mx-auto">
  <generic-card tone="cyan" padding="md">
    <h1 class="text-lg mb-1" style="color: var(--color-text)">Solicitar whitelist</h1>
    <p class="text-sm mb-6" style="color: var(--color-text-muted)">
      Pedí que se habilite un email para que un profesor pueda registrarse.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4" novalidate>
      <div>
        <label class="fu-label" for="email">Email a habilitar</label>
        <input id="email" type="email" class="fu-input" formControlName="email" />
      </div>
      <div>
        <label class="fu-label" for="reason">Motivo</label>
        <textarea id="reason" class="fu-input" rows="3" formControlName="reason" placeholder="ej. designación de cátedra"></textarea>
        @if (form.controls.reason.invalid && form.controls.reason.touched) {
          <p class="fu-field-error">Contanos para qué se habilita este email.</p>
        }
      </div>

      @if (errorMessage()) {
        <div class="fu-alert fu-alert--danger">
          {{ errorMessage() }}
        </div>
      }

      <button fuButton variant="primary" type="submit" [loading]="loading()" class="w-full">Enviar solicitud</button>
    </form>
  </generic-card>
</div>
