<fu-auth-shell title="Nueva contraseña">
  @if (success()) {
    <div class="text-center">
      <div class="text-5xl mb-4">🔐</div>
      <p class="text-sm" style="color: var(--color-text-muted)">Tu contraseña fue actualizada. Ya podés iniciar sesión.</p>
    </div>
    <button fuButton variant="primary" size="lg" class="mt-6 w-full" (click)="goLogin()">Iniciar sesión</button>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4" novalidate>
      <div>
        <label class="fu-label" for="newPassword">Nueva contraseña</label>
        <input id="newPassword" type="password" class="fu-input" formControlName="newPassword" autocomplete="new-password" />
        <fu-password-strength [password]="form.controls.newPassword.value" />
      </div>
      <div>
        <label class="fu-label" for="confirmPassword">Confirmar contraseña</label>
        <input id="confirmPassword" type="password" class="fu-input" formControlName="confirmPassword" autocomplete="new-password" />
        @if (form.errors?.['mismatch'] && form.controls.confirmPassword.touched) {
          <p class="fu-field-error">Las contraseñas no coinciden.</p>
        }
      </div>

      @if (errorMessage()) {
        <div class="fu-alert fu-alert--danger">
          {{ errorMessage() }}
        </div>
      }

      <button fuButton variant="primary" size="lg" type="submit" [loading]="loading()" [disabled]="!token" class="w-full">
        Restablecer contraseña
      </button>
    </form>
  }
</fu-auth-shell>
