<div class="stat tone-{{ tone() }}">
  <span class="pixel tl"></span>
  <span class="pixel tr"></span>
  <span class="pixel bl"></span>
  <span class="pixel br"></span>
  <div class="top">
    <span class="label">{{ label() }}</span>
    @if (icon(); as iconName) {
    <generic-icon [name]="iconName" [size]="18" />
    }
  </div>
  <strong>{{ value() }}</strong>
  @if (hint()) {
  <small>{{ hint() }}</small>
  }
</div>
