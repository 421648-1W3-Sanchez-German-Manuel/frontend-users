# El nginx que sirve los estaticos de la SPA, dentro del contenedor del front.
#
# NO confundir con tpi-compose/nginx/nginx.conf, que es el proxy reverso del
# borde. Este no conoce la API ni le habla a nadie: solo devuelve archivos.
# Esa separacion es lo que permite que el front viva en la red tpi-front, sin
# ruta hacia el gateway.

server {
    listen 4200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El proxy del borde chequea esto para saber si el front esta servible.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Los bundles de Angular llevan hash en el nombre, asi que se pueden cachear
    # para siempre: si cambia el contenido, cambia el nombre.
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html NO se cachea: es el que referencia a los bundles con hash. Si
    # queda cacheado, el navegador sigue pidiendo los bundles viejos despues de
    # un deploy y la app queda rota hasta un hard refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Routing del lado del cliente: cualquier path desconocido devuelve
    # index.html y decide el Router. Sin esto, entrar directo a
    # /activate?token=... -o recargar cualquier pantalla- da el 404 de nginx,
    # y justamente el enlace del mail se abre siempre "directo".
    location / {
        try_files $uri $uri/ /index.html;
    }
}
